services:
  mongo-test:
    image: mongo:7.0.16
    tmpfs:
      - /data/db
      - /data/configdb
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  test:
    build:
      context: ./server
      dockerfile: Dockerfile.test
    depends_on:
      mongo-test:
        condition: service_healthy
